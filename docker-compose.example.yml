services:
  mediaflow:
    image: ghcr.io/diddlik/mediaflow:latest
    container_name: mediaflow
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin

      # Initial defaults. After settings are saved in the Web UI,
      # ./data/runtime-settings.json takes precedence for these runtime values.
      MediaFlow__DryRun: "true"
      MediaFlow__Automation__Enabled: "true"
      MediaFlow__ReconciliationIntervalSeconds: "300"
      MediaFlow__Automation__MaxFilesPerSharePerCycle: "200"
      MediaFlow__Automation__AllowFilesystemTimestampFallback: "false"

      # Optional MQTT integration. Disabled by default.
      MediaFlow__Mqtt__Enabled: "false"
      MediaFlow__Mqtt__Host: "192.168.1.10"
      MediaFlow__Mqtt__Port: "1883"
      MediaFlow__Mqtt__ClientId: "mediaflow"
      MediaFlow__Mqtt__BaseTopic: "mediaflow"
      MediaFlow__Mqtt__UseTls: "false"
      MediaFlow__Mqtt__ReconnectSeconds: "5"
      # MediaFlow__Mqtt__Username: "mediaflow"
      # MediaFlow__Mqtt__Password: "change-me"

    volumes:
      # SQLite database and persistent runtime settings.
      - ./data:/app/data

      # Example source shares. The sync software is irrelevant to MediaFlow.
      - /volume1/photos/pavel:/sources/pavel
      - /volume1/photos/elena:/sources/elena
      - /volume1/photos/elisabeth:/sources/elisabeth

      # Common share synchronized back to all participating devices.
      - /volume1/photos/family:/destinations/family

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
