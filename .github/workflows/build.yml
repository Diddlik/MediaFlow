name: build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MomentFerry.sln

      - name: Build
        run: dotnet build MomentFerry.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MomentFerry.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Build Docker image
        run: docker build --tag momentferry:ci .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
